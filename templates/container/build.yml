# Keep legacy job name; prefer templates/container/build-push.yml for multi-registry.
# This wrapper pushes to GitLab registry only (PUSH_REGISTRIES=gitlab).

include:
  - local: templates/container/build-push.yml

.container_build:
  extends: .container_build_push
  variables:
    PUSH_REGISTRIES: "gitlab"

container:build:
  extends: .container_build
