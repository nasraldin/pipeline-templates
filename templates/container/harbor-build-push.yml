.container_harbor_build_push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    HARBOR_REGISTRY: "${HARBOR_REGISTRY:-harbor.nasraldin.com}"
    HARBOR_IMAGE: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}"
    CONTAINER_IMAGE: "${HARBOR_IMAGE}"
  before_script:
    - echo "${HARBOR_PASSWORD}" | docker login "${HARBOR_REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
  script:
    - docker build -t "${HARBOR_IMAGE}" .
    - docker push "${HARBOR_IMAGE}"
  rules:
    - if: $HARBOR_PASSWORD
      exists:
        - Dockerfile

container:harbor-build-push:
  extends: .container_harbor_build_push
