# Node/pnpm unit tests (Node 24).
#
# Requires package.json with a `test` script (or set NODE_TEST_CMD).
#
# Optional:
#   NODE_TEST_CMD — default: pnpm run test
#   PNPM_FROZEN — default true

include:
  - local: templates/common/node24.yml

.node_test:
  extends: .node24_base
  stage: test
  variables:
    NODE_TEST_CMD: "pnpm run test"
    PNPM_FROZEN: "true"
  script:
    - |
      set -euo pipefail
      if [ ! -f package.json ]; then
        echo "No package.json — skipping tests"
        exit 0
      fi
      if [ -f pnpm-lock.yaml ] && [ "${PNPM_FROZEN}" = "true" ]; then
        pnpm install --frozen-lockfile
      else
        pnpm install
      fi
      eval "${NODE_TEST_CMD}"
  rules:
    - changes:
        - "package.json"
        - "pnpm-lock.yaml"
        - "pnpm-workspace.yaml"
        - "**/*.{js,jsx,ts,tsx,mjs,cjs}"
        - "**/__tests__/**"
        - "**/*.{test,spec}.{js,ts,jsx,tsx}"

node:test:
  extends: .node_test
