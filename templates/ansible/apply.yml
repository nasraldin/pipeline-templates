.ansible_apply:
  stage: apply
  image:
    name: cytopia/ansible:latest-tools
    entrypoint: [""]
  variables:
    ANSIBLE_DIR: ansible
  script:
    - |
      set -eu
      cd "${ANSIBLE_DIR}"
      export ANSIBLE_ROLES_PATH="${PWD}/roles"
      export ANSIBLE_CONFIG="${PWD}/ansible.cfg"
      bash scripts/ci-run.sh
  when: manual
  resource_group: ansible-apply
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

ansible:apply:
  extends: .ansible_apply

ansible:apply:targeted:
  extends: .ansible_apply
  rules:
    - if: $ANSIBLE_LIMIT != null && $ANSIBLE_LIMIT != "" && $ANSIBLE_LIMIT !~ /\$/
