.ansible_apply:
  stage: apply
  image: cytopia/ansible:latest-tools
  variables:
    ANSIBLE_DIR: ansible
  script:
    - cd "${ANSIBLE_DIR}" && bash scripts/ci-run.sh
  when: manual
  resource_group: ansible-apply
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

ansible:apply:
  extends: .ansible_apply

ansible:apply:targeted:
  extends: .ansible_apply
  variables:
    ANSIBLE_LIMIT: $ANSIBLE_LIMIT
    ANSIBLE_PLAYBOOK: $ANSIBLE_PLAYBOOK
  rules:
    - if: $ANSIBLE_LIMIT
