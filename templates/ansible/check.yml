.ansible_check:
  stage: validate
  image:
    name: cytopia/ansible:latest-tools
    entrypoint: [""]
  variables:
    ANSIBLE_CHECK: "true"
    ANSIBLE_DIR: ansible
  script:
    - |
      set -eu
      cd "${ANSIBLE_DIR}"
      # World-writable CI workspaces ignore ansible.cfg — pin roles path.
      export ANSIBLE_ROLES_PATH="${PWD}/roles"
      export ANSIBLE_CONFIG="${PWD}/ansible.cfg"
      ansible-playbook --syntax-check -i inventory/hosts.yml "${ANSIBLE_PLAYBOOK:-playbooks/site.yml}"
      # Live --check needs SSH to inventory hosts; skip when no CI key is present.
      if [ -z "${ANSIBLE_PRIVATE_KEY:-}${SSH_PRIVATE_KEY:-}" ] && [ ! -f "${HOME}/.ssh/id_rsa" ] && [ ! -f "${HOME}/.ssh/id_ed25519" ]; then
        echo "Skipping ansible --check: no SSH private key in CI (syntax-check passed)."
        exit 0
      fi
      bash scripts/ci-run.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - changes:
        - ansible/**/*

ansible:check:
  extends: .ansible_check

ansible:check:targeted:
  extends: .ansible_check
  rules:
    # Require a real limit; ignore unexpanded "$ANSIBLE_LIMIT" from GitLab UI defaults.
    - if: $ANSIBLE_LIMIT != null && $ANSIBLE_LIMIT != "" && $ANSIBLE_LIMIT !~ /\$/
