.ansible_check:
  stage: validate
  image:
    name: cytopia/ansible:latest-tools
    entrypoint: [""]
  variables:
    ANSIBLE_CHECK: "true"
    ANSIBLE_DIR: ansible
  script:
    - |
      set -eu
      cd "${ANSIBLE_DIR}"
      # GitLab build dirs are world-writable; ansible ignores ansible.cfg there.
      export ANSIBLE_ROLES_PATH="${PWD}/roles"
      export ANSIBLE_CONFIG="${PWD}/ansible.cfg"
      bash scripts/ci-run.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - changes:
        - ansible/**/*

ansible:check:
  extends: .ansible_check

# Do not re-assign ANSIBLE_* from $ANSIBLE_* (circular → literal "$ANSIBLE_LIMIT").
ansible:check:targeted:
  extends: .ansible_check
  rules:
    - if: $ANSIBLE_LIMIT != null && $ANSIBLE_LIMIT != "" && $ANSIBLE_LIMIT !~ /\$/
