.lint_yaml:
  stage: lint
  image:
    name: pipelinecomponents/yamllint:latest
    entrypoint: [""]
  script:
    - |
      set -euo pipefail
      if [ -f .yamllint.yaml ]; then
        yamllint -c .yamllint.yaml .
      elif [ -f .yamllint.yml ]; then
        yamllint -c .yamllint.yml .
      else
        # Relaxed defaults when a repo has not committed a config yet.
        yamllint -d '{extends: relaxed, rules: {line-length: {max: 200}}}' .
      fi
  rules:
    - changes:
        - "**/*.{yml,yaml}"

lint:yaml:
  extends: .lint_yaml
