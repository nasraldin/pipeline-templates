# YAML lint (yamllint). Prefer also including lint:prettier for formatting.

.lint_yaml:
  stage: lint
  image:
    name: pipelinecomponents/yamllint:0.35.13
    entrypoint: [""]
  script:
    - |
      set -euo pipefail
      if [ -f .yamllint.yaml ]; then
        yamllint -c .yamllint.yaml .
      elif [ -f .yamllint.yml ]; then
        yamllint -c .yamllint.yml .
      else
        yamllint -d '{extends: relaxed, rules: {line-length: {max: 200}}}' .
      fi
  rules:
    - changes:
        - "**/*.{yml,yaml}"
        - ".yamllint.yaml"
        - ".yamllint.yml"

lint:yaml:
  extends: .lint_yaml
