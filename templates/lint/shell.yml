# ShellCheck for bash/sh scripts.

.lint_shell:
  stage: lint
  image:
    name: koalaman/shellcheck-alpine:v0.10.0
    entrypoint: [""]
  script:
    - |
      set -eu
      files="$(find . -type f \( -name '*.sh' -o -name '*.bash' \) ! -path './.git/*' ! -path './node_modules/*' | sort)"
      if [ -z "$files" ]; then
        echo "No shell scripts"
        exit 0
      fi
      # shellcheck disable=SC2086
      shellcheck -x $files
  rules:
    - changes:
        - "**/*.sh"
        - "**/*.bash"

lint:shell:
  extends: .lint_shell
