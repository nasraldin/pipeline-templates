.lint_ansible:
  stage: lint
  image:
    name: pipelinecomponents/ansible-lint:latest
    entrypoint: [""]
  variables:
    ANSIBLE_DIR: ansible
  script:
    - |
      set -euo pipefail
      cd "${ANSIBLE_DIR}"
      # Use the ansible-core bundled with ansible-lint (needs >=2.15 for deb822_repository).
      ansible --version
      ansible-lint -v playbooks/
      ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/site.yml
  rules:
    - changes:
        - ansible/**/*

lint:ansible:
  extends: .lint_ansible
