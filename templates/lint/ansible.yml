.lint_ansible:
  stage: lint
  image:
    name: pipelinecomponents/ansible-lint:latest
    entrypoint: [""]
  variables:
    ANSIBLE_DIR: ansible
  script:
    - |
      set -euo pipefail
      cd "${ANSIBLE_DIR}"
      # Ensure ansible-core is new enough for ansible.builtin.deb822_repository (≥2.15).
      ansible-lint playbooks/
      ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/site.yml
  rules:
    - changes:
        - ansible/**/*

lint:ansible:
  extends: .lint_ansible
