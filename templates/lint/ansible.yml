.lint_ansible:
  stage: lint
  image:
    name: pipelinecomponents/ansible-lint:latest
    entrypoint: [""]
  variables:
    ANSIBLE_DIR: ansible
  script:
    - |
      set -euo pipefail
      cd "${ANSIBLE_DIR}"
      # GitLab build dirs are world-writable; ansible ignores ansible.cfg there.
      export ANSIBLE_ROLES_PATH="${PWD}/roles"
      export ANSIBLE_CONFIG="${PWD}/ansible.cfg"
      ansible --version
      ansible-lint -v playbooks/
      ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/site.yml
  rules:
    - changes:
        - ansible/**/*

lint:ansible:
  extends: .lint_ansible
