# JSON syntax check (jq). Prefer lint:prettier for formatting.

.lint_json:
  stage: lint
  image: alpine:3.20
  before_script:
    - apk add --no-cache jq findutils
  script:
    - |
      set -eu
      fail=0
      for f in $(find . -type f -name '*.json' ! -path './.git/*' ! -path './node_modules/*' ! -path './.terraform/*' | sort); do
        if ! jq empty "$f" >/dev/null 2>&1; then
          echo "INVALID JSON: $f"
          fail=1
        else
          echo "OK $f"
        fi
      done
      exit "$fail"
  rules:
    - changes:
        - "**/*.json"

lint:json:
  extends: .lint_json
