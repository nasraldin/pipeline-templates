.gitops_kubeconform:
  stage: validate
  # Runner prepare_script needs /bin/sh — use alpine and install kubeconform.
  image: alpine:3.21
  script:
    - |
      set -eu
      apk add --no-cache curl tar >/dev/null
      curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
        | tar -xz -C /usr/local/bin kubeconform
      for dir in platform/*/; do
        [ -d "${dir}" ] || continue
        comp=$(basename "${dir}")
        if [ -n "${GITOPS_COMPONENT:-}" ] && [ "${comp}" != "${GITOPS_COMPONENT}" ]; then
          continue
        fi
        # Skip Helm value files (no kind/apiVersion).
        find "${dir}" \( -name 'values.yaml' -o -name 'Chart.yaml' \) -prune -o -name '*.yaml' -print0 \
          | xargs -0 -r kubeconform -summary -ignore-missing-schemas
      done
  rules:
    - changes:
        - platform/**/*
        - clusters/**/*

gitops:kubeconform:
  extends: .gitops_kubeconform
