.gitops_kubeconform:
  stage: validate
  # Alpine tag includes a shell; scratch kubeconform image cannot run GitLab script steps.
  image:
    name: ghcr.io/yannh/kubeconform:v0.6.7-alpine
    entrypoint: [""]
  script:
    - |
      set -eu
      for dir in platform/*/; do
        [ -d "${dir}" ] || continue
        comp=$(basename "${dir}")
        if [ -n "${GITOPS_COMPONENT:-}" ] && [ "${comp}" != "${GITOPS_COMPONENT}" ]; then
          continue
        fi
        find "${dir}" -name '*.yaml' -print0 | xargs -0 -r kubeconform -summary -ignore-missing-schemas
      done
  rules:
    - changes:
        - platform/**/*
        - clusters/**/*

gitops:kubeconform:
  extends: .gitops_kubeconform
