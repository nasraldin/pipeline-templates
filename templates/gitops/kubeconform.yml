.gitops_kubeconform:
  stage: validate
  image: ghcr.io/yannh/kubeconform:latest
  script:
    - |
      kubectl() { true; }
      for dir in platform/*/; do
        comp=$(basename "${dir}")
        if [[ -n "${GITOPS_COMPONENT}" && "${comp}" != "${GITOPS_COMPONENT}" ]]; then
          continue
        fi
        find "${dir}" -name '*.yaml' -print0 | xargs -0 -r kubeconform -summary -ignore-missing-schemas
      done
  rules:
    - changes:
        - platform/**/*
        - clusters/**/*

gitops:kubeconform:
  extends: .gitops_kubeconform
