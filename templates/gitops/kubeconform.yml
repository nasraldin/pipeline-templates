.gitops_kubeconform:
  stage: validate
  # Runner prepare_script needs /bin/sh — use alpine and install kubeconform.
  image: alpine:3.22
  variables:
    KUBECONFORM_VERSION: "v0.8.0"
    CI_TOOLS_DIR: ".ci-tools"
  cache:
    key: "kubeconform-${KUBECONFORM_VERSION}"
    paths:
      - .ci-tools/
    policy: pull-push
    when: on_success
  script:
    - |
      set -eu
      apk add --no-cache curl tar >/dev/null
      TOOLS="${CI_PROJECT_DIR}/${CI_TOOLS_DIR}"
      mkdir -p "${TOOLS}"
      if [ -x "${TOOLS}/kubeconform" ]; then
        echo "cache hit: kubeconform"
      else
        echo "cache miss: downloading kubeconform ${KUBECONFORM_VERSION}"
        curl -fsSL --connect-timeout 15 --max-time 600 --retry 3 --retry-delay 2 \
          "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
          | tar -xz -C "${TOOLS}" kubeconform
        chmod +x "${TOOLS}/kubeconform"
      fi
      ln -sf "${TOOLS}/kubeconform" /usr/local/bin/kubeconform
      for dir in platform/*/; do
        [ -d "${dir}" ] || continue
        comp=$(basename "${dir}")
        if [ -n "${GITOPS_COMPONENT:-}" ] && [ "${comp}" != "${GITOPS_COMPONENT}" ]; then
          continue
        fi
        # Skip Helm values/Chart (no kind). Prefer ! -name — BusyBox find -prune is unreliable on files.
        find "${dir}" -type f \( -name '*.yaml' -o -name '*.yml' \) \
          ! -name 'values.yaml' ! -name 'values.yml' \
          ! -name 'Chart.yaml' ! -name 'Chart.yml' \
          -print0 \
          | xargs -0 -r kubeconform -summary -ignore-missing-schemas
      done
  rules:
    - changes:
        - platform/**/*
        - clusters/**/*

gitops:kubeconform:
  extends: .gitops_kubeconform
