.gitops_helm_lint:
  stage: lint
  # alpine/helm entrypoint is `helm`; clear it so we can run a shell script.
  image:
    name: alpine/helm:3.17
    entrypoint: [""]
  script:
    - |
      set -euo pipefail
      apk add --no-cache python3 py3-yaml >/dev/null
      find platform -type f \( -name 'apps.yaml' -o -name 'values.yaml' \) -print0 \
        | while IFS= read -r -d '' f; do
            echo "==> parse ${f}"
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "${f}"
          done
  rules:
    - changes:
        - platform/**/*

gitops:helm-lint:
  extends: .gitops_helm_lint
