# Talos CI tool cache base — version-keyed GitLab cache under .ci-tools/
#
# Required in consumer repo:
#   versions.env with TALOS_VERSION=vX.Y.Z
#   scripts/ci-install-talos-tools.sh (and optionally ci-install-kubectl.sh)
#
# Variables (override in consumer):
#   TALHELPER_VERSION, SOPS_VERSION, KUBECTL_VERSION, TOOL_CACHE_PREFIX
#
# Usage:
#   include:
#     - project: homelab/pipeline-templates
#       file: templates/talos/tools.yml
#   talos:genconfig:
#     extends: .talos_tools_base
#     before_script:
#       - sh scripts/ci-install-talos-tools.sh

include:
  - local: /templates/common/tool-cache.yml

variables:
  TALHELPER_VERSION: "v3.1.17"
  SOPS_VERSION: "v3.13.3"
  TOOL_CACHE_PREFIX: "talos-tools-${TALHELPER_VERSION}-${SOPS_VERSION}"

.talos_tools_base:
  extends: .tool_cache
  image: alpine:3.21
