# Talos CI CLIs: talhelper, sops, talosctl (+ optional kubectl).
# Version-keyed GitLab cache under .ci-tools/ — download only on miss / version bump.
#
# Required project files:
#   versions.env with TALOS_VERSION=vX.Y.Z
#
# Variables (override in consumer):
#   TALHELPER_VERSION, SOPS_VERSION, KUBECTL_VERSION
#
# Usage (anchors do NOT cross include files — use !reference):
#   include: templates/talos/tools.yml
#   talos:genconfig:
#     extends: .talos_tools_base
#     before_script:
#       - !reference [.install_talos_tools, before_script, 0]

include:
  - local: /templates/common/tool-cache.yml

variables:
  TALHELPER_VERSION: "v3.1.17"
  SOPS_VERSION: "v3.13.3"
  TOOL_CACHE_PREFIX: "talos-tools-${TALHELPER_VERSION}-${SOPS_VERSION}"

.talos_tools_base:
  extends: .tool_cache
  image: alpine:3.21

.install_talos_tools:
  before_script:
    - |
      set -euo pipefail
      apk add --no-cache bash curl tar gzip bind-tools python3 >/dev/null
      mkdir -p "${CI_PROJECT_DIR}/${CI_TOOLS_DIR:-.ci-tools}"
      ARCH=amd64
      case "$(uname -m)" in aarch64|arm64) ARCH=arm64 ;; esac
      TALOS_VER="$(grep '^TALOS_VERSION=' versions.env | cut -d= -f2)"
      test -n "${TALOS_VER}"

      ensure_ci_bin() {
        local name="$1" url="$2" mode="${3:-file}"
        local dir="${CI_PROJECT_DIR}/${CI_TOOLS_DIR:-.ci-tools}"
        local dest="${dir}/${name}"
        mkdir -p "${dir}"
        if [ -x "${dest}" ]; then
          echo "cache hit: ${name}"
        else
          echo "cache miss: downloading ${name}"
          if [ "${mode}" = "tgz" ]; then
            curl -fsSL --connect-timeout 15 --max-time 180 --retry 3 --retry-delay 2 \
              "${url}" | tar -xz -C "${dir}" "${name}"
          else
            curl -fsSL --connect-timeout 15 --max-time 180 --retry 3 --retry-delay 2 \
              "${url}" -o "${dest}"
          fi
          chmod +x "${dest}"
        fi
        ln -sf "${dest}" "/usr/local/bin/${name}"
      }

      ensure_ci_bin talhelper \
        "https://github.com/budimanjojo/talhelper/releases/download/${TALHELPER_VERSION}/talhelper_linux_${ARCH}.tar.gz" \
        tgz
      ensure_ci_bin sops \
        "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.${ARCH}"
      ensure_ci_bin talosctl \
        "https://github.com/siderolabs/talos/releases/download/${TALOS_VER}/talosctl-linux-${ARCH}"
      chmod +x scripts/*.sh

.install_kubectl:
  before_script:
    - |
      set -euo pipefail
      ARCH=amd64
      case "$(uname -m)" in aarch64|arm64) ARCH=arm64 ;; esac
      KVER="${KUBECTL_VERSION:-}"
      if [ -z "${KVER}" ]; then
        echo "KUBECTL_VERSION must be pinned (do not hit dl.k8s.io/stable.txt every run)" >&2
        exit 1
      fi
      dir="${CI_PROJECT_DIR}/${CI_TOOLS_DIR:-.ci-tools}"
      dest="${dir}/kubectl-${KVER}"
      mkdir -p "${dir}"
      if [ -x "${dest}" ]; then
        echo "cache hit: kubectl ${KVER}"
      else
        echo "cache miss: downloading kubectl ${KVER}"
        curl -fsSL --connect-timeout 15 --max-time 180 --retry 3 --retry-delay 2 \
          "https://dl.k8s.io/release/${KVER}/bin/linux/${ARCH}/kubectl" -o "${dest}"
        chmod +x "${dest}"
      fi
      ln -sf "${dest}" /usr/local/bin/kubectl
