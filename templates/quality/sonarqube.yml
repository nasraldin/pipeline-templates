# SonarQube / SonarScanner quality gate.
# Requires SONAR_HOST_URL + SONAR_TOKEN (prefer Infisical → CI vars).
#
# Optional:
#   SONAR_PROJECT_KEY — default $CI_PROJECT_PATH_SLUG
#   SONAR_EXTRA_ARGS — extra -D flags

.sonarqube_scan:
  stage: quality
  image: sonarsource/sonar-scanner-cli:12
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    SONAR_PROJECT_KEY: "${CI_PROJECT_PATH_SLUG}"
    SONAR_EXTRA_ARGS: ""
  script:
    - |
      set -euo pipefail
      # shellcheck disable=SC2086
      sonar-scanner \
        -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
        -Dsonar.sources=. \
        -Dsonar.host.url="${SONAR_HOST_URL}" \
        -Dsonar.login="${SONAR_TOKEN}" \
        ${SONAR_EXTRA_ARGS}
  rules:
    - if: $SONAR_TOKEN && $SONAR_HOST_URL

quality:sonarqube:
  extends: .sonarqube_scan
