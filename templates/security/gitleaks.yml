# Secret scanning with Gitleaks (detect hardcoded credentials in git history / tree).
# Include from consumer repos; override rules as needed.
#
# Optional CI variables:
#   GITLEAKS_CONFIG   — path to .gitleaks.toml (default: none / built-in)
#   GITLEAKS_EXIT_CODE — default 1 (fail on findings); set 0 for report-only

.security_gitleaks:
  stage: validate
  image:
    name: zricethezav/gitleaks:v8.24.3
    entrypoint: [""]
  variables:
    # GitLab does not expand bash ${VAR:-default} in `variables:`; set real defaults.
    GITLEAKS_EXIT_CODE: "1"
    # Homelab default: scan the checked-out tree only. History still needs a
    # one-time scrub/rotate after secrets were previously committed.
    GITLEAKS_NO_GIT: "true"
  script:
    - |
      set -euo pipefail
      EXIT_CODE="${GITLEAKS_EXIT_CODE:-1}"
      EXTRA=()
      if [ -n "${GITLEAKS_CONFIG:-}" ] && [ -f "${GITLEAKS_CONFIG}" ]; then
        EXTRA+=(--config "${GITLEAKS_CONFIG}")
      elif [ -f .gitleaks.toml ]; then
        EXTRA+=(--config .gitleaks.toml)
      fi
      if [ "${GITLEAKS_NO_GIT:-true}" = "true" ] || ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        gitleaks dir . --verbose --redact --exit-code "${EXIT_CODE}" "${EXTRA[@]}"
      else
        gitleaks detect --source . --verbose --redact --exit-code "${EXIT_CODE}" "${EXTRA[@]}"
      fi
  allow_failure: false

security:gitleaks:
  extends: .security_gitleaks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
