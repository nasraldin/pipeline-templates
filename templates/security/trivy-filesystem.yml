.security_trivy_filesystem:
  stage: validate
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  variables:
    # GitLab does not expand ${VAR:-default} in `variables:`; use literals and bash defaults in script.
    TRIVY_SEVERITY: "CRITICAL,HIGH"
    TRIVY_SCANNERS: "vuln,secret,misconfig"
    TRIVY_EXIT_CODE: "1"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_DISABLE_VEX_NOTICE: "true"
    TRIVY_SCAN_PATH: "."
  script:
    - |
      set -eu
      EXIT_CODE="${TRIVY_EXIT_CODE:-1}"
      SEVERITY="${TRIVY_SEVERITY:-CRITICAL,HIGH}"
      SCANNERS="${TRIVY_SCANNERS:-vuln,secret,misconfig}"
      SCAN_PATH="${TRIVY_SCAN_PATH:-.}"
      trivy fs "${SCAN_PATH}" \
        --exit-code "${EXIT_CODE}" \
        --severity "${SEVERITY}" \
        --scanners "${SCANNERS}" \
        --format table

security:trivy-fs-scan:
  extends: .security_trivy_filesystem
