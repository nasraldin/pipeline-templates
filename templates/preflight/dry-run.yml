# Hidden job — included by consumer pipelines for dry-runs.
# Prefer alpine + apk python3 over docker.io/library/python to avoid Hub
# rate-limit stampedes when many preflight jobs start together.
# Note: runner-01-docker allowed_pull_policies is [always] only — do not set
# job pull_policy if-not-present (runner_configuration_error).

.preflight_template_dry_run:
  stage: preflight
  image: alpine:3.21
  variables:
    # Runner must hit GitLab on LAN — public URL is behind Cloudflare (1010).
    GITLAB_API_URL: "http://192.168.68.12/api/v4"
    GITLAB_PROJECT_ID: "${CI_PROJECT_ID}"
    GITLAB_REF: "${CI_COMMIT_REF_NAME}"
  before_script:
    - apk add --no-cache python3
  script:
    # Prefer single-id when PREFLIGHT_ID is set (optional consumer matrix);
    # otherwise run all templates in one job to avoid Hub pull stampedes.
    - |
      if [ -n "${PREFLIGHT_ID:-}" ]; then
        python3 ci/preflight/validate.py --id "${PREFLIGHT_ID}"
      else
        python3 ci/preflight/validate.py --templates-only
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

.preflight_root_and_examples:
  stage: preflight
  image:
    name: alpine:3.21
    pull_policy: if-not-present
  variables:
    GITLAB_API_URL: "http://192.168.68.12/api/v4"
    GITLAB_PROJECT_ID: "${CI_PROJECT_ID}"
    GITLAB_REF: "${CI_COMMIT_REF_NAME}"
  before_script:
    - apk add --no-cache python3
  script:
    - python3 ci/preflight/validate.py --root-only
    - python3 ci/preflight/validate.py --examples-only
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
