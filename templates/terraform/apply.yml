.terraform_apply:
  stage: apply
  image:
    name: hashicorp/terraform:1.12
    entrypoint: [""]
  variables:
    TF_ACTION: apply
    TF_AUTO_APPROVE: "true"
    TF_DIR: terraform
  before_script:
    - apk add --no-cache bash >/dev/null
  script:
    - cd "${TF_DIR}" && terraform init -input=false
    - bash scripts/ci-run.sh
  when: manual
  resource_group: terraform-apply

terraform:apply:
  extends: .terraform_apply
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

terraform:apply:targeted:
  extends: .terraform_apply
  variables:
    TF_TARGET_GUESTS: $TF_TARGET_GUESTS
  rules:
    - if: $TF_TARGET_GUESTS != null && $TF_TARGET_GUESTS != ""
