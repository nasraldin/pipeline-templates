.terraform_plan:
  stage: plan
  image:
    name: hashicorp/terraform:1.12
    entrypoint: [""]
  variables:
    TF_ACTION: plan
    TF_DIR: terraform
  before_script:
    - apk add --no-cache bash >/dev/null
  script:
    - |
      set -eu
      TF_ROOT="${CI_PROJECT_DIR:-.}/${TF_DIR}"
      cd "${TF_ROOT}"
      terraform init -input=false
      terraform validate
      # Live plan needs Proxmox creds via TF_VAR_* / CI variables; skip when unset.
      if [ -z "${TF_VAR_proxmox_endpoint:-}" ] || [ -z "${TF_VAR_proxmox_api_token:-}" ] || [ -z "${TF_VAR_node_name:-}" ]; then
        echo "Skipping terraform plan: TF_VAR_proxmox_endpoint / TF_VAR_proxmox_api_token / TF_VAR_node_name not set in CI."
        exit 0
      fi
      bash scripts/ci-run.sh
  artifacts:
    paths:
      - terraform/tfplan
      - terraform/tfplan.txt
    expire_in: 1 week
    when: on_success
  resource_group: terraform-plan

terraform:plan:
  extends: .terraform_plan
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

terraform:plan:targeted:
  extends: .terraform_plan
  rules:
    # Only when an explicit non-empty guest list is provided (not the literal $TF_TARGET_GUESTS).
    - if: $TF_TARGET_GUESTS != null && $TF_TARGET_GUESTS != "" && $TF_TARGET_GUESTS !~ /\$/
