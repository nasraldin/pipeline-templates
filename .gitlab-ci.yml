include:
  - local: templates/lint/yaml.yml
  - local: templates/lint/shell.yml
  - local: templates/lint/markdown.yml
  - local: templates/lint/json.yml
  - local: templates/lint/prettier.yml
  - local: templates/security/gitleaks.yml
  - local: templates/preflight/dry-run.yml

stages:
  - preflight
  - lint
  - validate

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Preflight — GitLab CI Lint dry-run for every template + examples + root CI
# ---------------------------------------------------------------------------

preflight:root-and-examples:
  extends: .preflight_root_and_examples

preflight:template:
  extends: .preflight_template_dry_run
  parallel:
    matrix:
      - PREFLIGHT_ID:
          - common-node24
          - lint-prettier
          - lint-eslint
          - lint-yaml
          - lint-json
          - lint-markdown
          - lint-shell
          - lint-editorconfig
          - lint-terraform
          - lint-ansible
          - node-test
          - node-build
          - security-gitleaks
          - security-osv
          - security-snyk
          - security-trivy-fs
          - quality-sonarqube
          - container-build-push
          - container-build
          - container-harbor-build-push
          - container-harbor-push
          - container-trivy-image
          - container-syft-sbom
          - container-cosign-sign
          - container-scan-legacy
          - gitops-helm-lint
          - gitops-helm-template
          - gitops-helm-dry-run
          - gitops-values-lint
          - gitops-kubeconform
          - gitops-argocd-diff
          - terraform-init
          - terraform-validate
          - terraform-plan
          - terraform-apply
          - terraform-destroy
          - ansible-check
          - ansible-apply

# ---------------------------------------------------------------------------
# Self-lint (dogfood the lint templates)
# ---------------------------------------------------------------------------

lint:yaml:
  extends: .lint_yaml

lint:shell:
  extends: .lint_shell

lint:markdown:
  extends: .lint_markdown

lint:json:
  extends: .lint_json

lint:prettier:
  extends: .lint_prettier

security:gitleaks:
  extends: .security_gitleaks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: on_success
