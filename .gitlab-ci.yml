include:
  - local: templates/lint/yaml.yml
  - local: templates/lint/shell.yml
  - local: templates/lint/markdown.yml
  - local: templates/lint/json.yml
  - local: templates/lint/prettier.yml
  - local: templates/security/gitleaks.yml
  - local: templates/preflight/dry-run.yml

stages:
  - preflight
  - lint
  - validate

test:ajrly-cache-contracts:
  stage: validate
  image: alpine:3.21
  before_script:
    - apk add --no-cache python3 py3-yaml git nodejs npm ca-certificates bash
    - npm install --global pnpm@12.10.1 --registry=https://npm.ajrly.com/
  script:
    - python3 -m unittest discover -s ajrly/tests -v

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Preflight — GitLab CI Lint dry-run for every template + examples + root CI
# ---------------------------------------------------------------------------

preflight:root-and-examples:
  extends: .preflight_root_and_examples

# One job (not a 40-way matrix) to avoid docker.io 429 stampedes on Hub pulls.
preflight:templates:
  extends: .preflight_template_dry_run

# ---------------------------------------------------------------------------
# Self-lint (dogfood the lint templates)
# ---------------------------------------------------------------------------

lint:yaml:
  extends: .lint_yaml

lint:shell:
  extends: .lint_shell

lint:markdown:
  extends: .lint_markdown

lint:json:
  extends: .lint_json

lint:prettier:
  extends: .lint_prettier

security:gitleaks:
  extends: .security_gitleaks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: on_success
