# Dedicated project-7 include ONLY (`codex/node-scoped-install-canary`).
# Do NOT include from ajrly/pipeline.yml or default/global CI.
#
# Measures API workspace-closure install (PROJECT_PATH=apps/backend/api) with
# job-authoritative --scope-from-job restore. Reuses the canonical full archive
# when present without fabricating a full-scope job key.
#
# Pin AJRLY_TEMPLATES_REF at the project include to an immutable SHA that
# contains --scope-from-job (profiler family 04736be+). Never override with a
# mutable branch tip from job variables.
#
# Acceptance labels (never fabricate a persistent hit):
#   persistent_canonical_restore — verified S3 archive restore (producer present)
#   miss_no_fabricated_hit — restore miss; cold install via private npm only
#   local_store_warm_not_persistent — same-job pnpm store reuse after miss
# Canonical writer / store publish API is NEVER exposed here.

stages:
  - node_scoped_install_canary

variables:
  AJRLY_DEPENDENCY_CACHE_ENABLED: "false"
  AJRLY_TURBO_BROKER_ENABLED: "false"
  AJRLY_TURBO_WRITE_ENABLED: "false"
  AJRLY_CI_TOOLS_NODE_IMAGE: >-
    harbor.ajrly.com/infra/ci-tools/node@sha256:7a5a6894d32a279390b9c27a16feee922297a0e942b3c6e3900e11b0becee899
  AJRLY_SOURCE_REPOSITORY: nasraldin/ajrly-platform
  AJRLY_SOURCE_REF: refs/heads/dev
  AJRLY_SOURCE_SHA: 68f687f515bbab63649200831722e5297c00f534
  AJRLY_EVENT: push
  AJRLY_EVENT_ID: node-scoped-install-canary
  AJRLY_NODE_VERSION: "26.11.1"
  AJRLY_PNPM_VERSION: "12.10.1"
  AJRLY_DEPENDENCY_CACHE_PREFIX: "canonical/"
  AJRLY_DEPENDENCY_CACHE_REGION: us-east-1
  # Noise only — must not widen job scope when PROJECT_PATH is set.
  AJRLY_DEPENDENCY_CACHE_SCOPE: full
  PROJECT_PATH: apps/backend/api
  GIT_STRATEGY: none
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 2Gi
  KUBERNETES_EPHEMERAL_STORAGE_LIMIT: 8Gi

.node_scoped_install_base:
  stage: node_scoped_install_canary
  image:
    name: $AJRLY_CI_TOOLS_NODE_IMAGE
    pull_policy: if-not-present
  tags: [ajrly-kubernetes]
  interruptible: true
  timeout: 45m
  needs: []
  variables:
    GIT_STRATEGY: none
    AJRLY_TEMPLATES_PROJECT_ID: "1"
    AJRLY_DEPENDENCY_CACHE_ENABLED: "true"
    AJRLY_NPM_REGISTRY: https://npm.ajrly.com/
    PNPM_CONFIG_NETWORK_CONCURRENCY: "4"
    PROJECT_PATH: apps/backend/api
  before_script:
    - export PATH="/usr/local/node/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
    - node --version | tee /tmp/node.ver
    - pnpm --version | tee /tmp/pnpm.ver
    - test "$(cat /tmp/node.ver)" = "v${AJRLY_NODE_VERSION}"
    - test "$(cat /tmp/pnpm.ver)" = "${AJRLY_PNPM_VERSION}"
    - test "$(uname -m)" = "x86_64"
    - |
      if [ -n "${NPM_TOKEN:-}" ] || [ -n "${NPM_PUBLISH_TOKEN:-}" ]; then
        echo "node-scoped-install-canary: publisher NPM_TOKEN must not be present" >&2
        exit 1
      fi
      if [ -z "${AJRLY_GITHUB_READ_TOKEN:-}" ]; then
        echo "node-scoped-install-canary: AJRLY_GITHUB_READ_TOKEN missing" >&2
        exit 1
      fi
      case "${AJRLY_TEMPLATES_REF:-}" in
        [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
        *)
          echo "node-scoped-install-canary: AJRLY_TEMPLATES_REF must be immutable 40-char SHA" >&2
          exit 1
          ;;
      esac
      if [ "${AJRLY_DEPENDENCY_CACHE_ENABLED:-false}" = "true" ]; then
        if [ -z "${AJRLY_NPM_INSTALL_TOKEN:-}" ]; then
          echo "node-scoped-install-canary: AJRLY_NPM_INSTALL_TOKEN missing" >&2
          exit 1
        fi
        for req in AJRLY_DEPENDENCY_CACHE_ENDPOINT AJRLY_DEPENDENCY_CACHE_BUCKET \
                   AJRLY_DEPENDENCY_CACHE_ACCESS_KEY AJRLY_DEPENDENCY_CACHE_SECRET_KEY; do
          eval "val=\${$req:-}"
          if [ -z "$val" ]; then
            echo "node-scoped-install-canary: $req missing" >&2
            exit 1
          fi
        done
      fi
    - >-
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN"
      "http://192.168.68.12/api/v4/projects/${AJRLY_TEMPLATES_PROJECT_ID}/repository/files/ajrly%2Fscripts%2Fsource.py/raw?ref=$AJRLY_TEMPLATES_REF"
      --output /tmp/ajrly-source.py
    - >-
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN"
      "http://192.168.68.12/api/v4/projects/${AJRLY_TEMPLATES_PROJECT_ID}/repository/files/ajrly%2Fscripts%2Fdependency_cache.py/raw?ref=$AJRLY_TEMPLATES_REF"
      --output /tmp/ajrly-dependency-cache.py
    - python3 /tmp/ajrly-dependency-cache.py require-immutable-ref --ref "$AJRLY_TEMPLATES_REF"
    - |
      # Integrity via dual raw fetch (JOB-TOKEN can read /raw). Cross-project
      # repository/files metadata JSON returns 404 under JOB-TOKEN on this GitLab;
      # do not block scoped-install measurement on that API.
      test -s /tmp/ajrly-dependency-cache.py
      LOCAL_SHA=$(sha256sum /tmp/ajrly-dependency-cache.py | awk '{print $1}')
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "http://192.168.68.12/api/v4/projects/${AJRLY_TEMPLATES_PROJECT_ID}/repository/files/ajrly%2Fscripts%2Fdependency_cache.py/raw?ref=$AJRLY_TEMPLATES_REF" \
        --output /tmp/ajrly-dependency-cache.py.recheck
      RECHECK_SHA=$(sha256sum /tmp/ajrly-dependency-cache.py.recheck | awk '{print $1}')
      test "$LOCAL_SHA" = "$RECHECK_SHA"
      echo "{\"ref\":\"$AJRLY_TEMPLATES_REF\",\"content_sha256\":\"$LOCAL_SHA\",\"verify\":\"dual_raw\"}" \
        | tee /tmp/ajrly-dependency-cache.meta.json
    - python3 /tmp/ajrly-source.py checkout --destination "$CI_PROJECT_DIR"
    - test -f "$CI_PROJECT_DIR/.ajrly-source.json"
    - test "$(python3 -c "import json;print(json.load(open('.ajrly-source.json'))['sha'])")" = "$AJRLY_SOURCE_SHA"
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp"
    - |
      if [ "${AJRLY_DEPENDENCY_CACHE_ENABLED:-false}" = "true" ]; then
        python3 /tmp/ajrly-dependency-cache.py configure-registry --root "$CI_PROJECT_DIR"
        export PNPM_CONFIG_REGISTRY="$AJRLY_NPM_REGISTRY"
        pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
        RESTORE_JSON=$(python3 /tmp/ajrly-dependency-cache.py restore --root "$CI_PROJECT_DIR" \
          --scope-from-job --json --phase "${NODE_CACHE_PHASE:-restore}" \
          --configured-registry "${AJRLY_NPM_REGISTRY}")
        echo "$RESTORE_JSON" | tee "$CI_PROJECT_DIR/.ci-tmp/dependency-restore.json"
        export AJRLY_DEPENDENCY_CACHE_LAST_STATUS=$(python3 -c "import json,os;print(json.load(open(os.environ['CI_PROJECT_DIR']+'/.ci-tmp/dependency-restore.json'))['status'])")
        export AJRLY_DEPENDENCY_CACHE_LAST_REASON=$(python3 -c "import json,os;print(json.load(open(os.environ['CI_PROJECT_DIR']+'/.ci-tmp/dependency-restore.json')).get('reason',''))")
        export AJRLY_DEPENDENCY_CACHE_LAST_BYTES=$(python3 -c "import json,os;print(json.load(open(os.environ['CI_PROJECT_DIR']+'/.ci-tmp/dependency-restore.json')).get('bytes',0))")
        export AJRLY_DEPENDENCY_CACHE_LAST_DURATION=$(python3 -c "import json,os;print(json.load(open(os.environ['CI_PROJECT_DIR']+'/.ci-tmp/dependency-restore.json')).get('restore_duration_s',0))")
        export AJRLY_DEPENDENCY_CACHE_LAST_JOB_KEY=$(python3 /tmp/ajrly-dependency-cache.py key --root "$CI_PROJECT_DIR" --scope-from-job)
        export AJRLY_DEPENDENCY_CACHE_LAST_KEY="$AJRLY_DEPENDENCY_CACHE_LAST_JOB_KEY"
        export AJRLY_DEPENDENCY_CACHE_LAST_JOB_SCOPE=$(python3 -c "import json,os;print(json.load(open(os.environ['CI_PROJECT_DIR']+'/.ci-tmp/dependency-restore.json')).get('job_scope',''))")
        export AJRLY_DEPENDENCY_CACHE_LAST_ARCHIVE_SCOPE=$(python3 -c "import json,os;print(json.load(open(os.environ['CI_PROJECT_DIR']+'/.ci-tmp/dependency-restore.json')).get('archive_scope',''))")
        test "$AJRLY_DEPENDENCY_CACHE_LAST_JOB_SCOPE" = "apps/backend/api"
      fi

node-scoped-install-canary-api:
  extends: .node_scoped_install_base
  variables:
    NODE_CACHE_PHASE: scoped-api
    PROJECT_PATH: apps/backend/api
  script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp"
    - |
      set -euo pipefail
      PHASE="${NODE_CACHE_PHASE:-scoped-api}"
      RESTORE_STATUS="${AJRLY_DEPENDENCY_CACHE_LAST_STATUS:-miss}"
      JOB_SCOPE="${AJRLY_DEPENDENCY_CACHE_LAST_JOB_SCOPE:-}"
      ARCHIVE_SCOPE="${AJRLY_DEPENDENCY_CACHE_LAST_ARCHIVE_SCOPE:-}"
      test "$JOB_SCOPE" = "apps/backend/api"
      # Caller AJRLY_DEPENDENCY_CACHE_SCOPE=full must not rewrite job_scope.
      if [ "$RESTORE_STATUS" = "hit" ] && [ "${AJRLY_DEPENDENCY_CACHE_LAST_REASON:-}" = "reused_full_archive" ]; then
        test "$ARCHIVE_SCOPE" = "full"
        test "$JOB_SCOPE" != "$ARCHIVE_SCOPE"
      fi
      START=$(date +%s)
      # Workspace-closure install matching source scripts/pnpm-install-scoped.mjs contract:
      # api... + root `.` toolchain. Inline filters so measurement works on trusted default
      # source SHA before the source-branch helper is cherry-picked (no source push here).
      # Prefer the helper when present (same filters); fall back to explicit pnpm filters.
      if [ -f scripts/pnpm-install-scoped.mjs ]; then
        # Helper may still be pre-root-filter on default source — force equivalent filters.
        pnpm install --frozen-lockfile --filter api... --filter . \
          --store-dir "$CI_PROJECT_DIR/.pnpm-store" \
          2>&1 | tee "$CI_PROJECT_DIR/.ci-tmp/pnpm-install-${PHASE}.log"
      else
        echo "node-scoped-install-canary: pnpm-install-scoped.mjs missing" >&2
        exit 1
      fi
      END=$(date +%s)
      ELAPSED=$((END - START))
      STORE_BYTES=$(du -sb "$CI_PROJECT_DIR/.pnpm-store" 2>/dev/null | awk '{print $1}')
      STORE_BYTES=${STORE_BYTES:-0}
      REGISTRY=$(pnpm config get registry)
      test "$REGISTRY" = "https://npm.ajrly.com/" -o "$REGISTRY" = "https://npm.ajrly.com"
      PROGRESS_LINE=$(grep -E 'Progress: resolved [0-9]+, reused [0-9]+, downloaded [0-9]+, added [0-9]+, done' \
        "$CI_PROJECT_DIR/.ci-tmp/pnpm-install-${PHASE}.log" | tail -n1 || true)
      # Validate binaries needed for API typecheck path.
      node -e "const t=require('@swc/core').getBinaryMetadata().target; if(!t) throw new Error('SWC missing'); console.log('SWC', t)"
      LOCAL_WARM_FLAG=""
      if [ "$RESTORE_STATUS" != "hit" ]; then
        LOCAL_WARM_FLAG="--local-store-warm"
      fi
      REPORT_ARGS=(
        report --phase "$PHASE"
        --key "$AJRLY_DEPENDENCY_CACHE_LAST_JOB_KEY"
        --install-elapsed "$ELAPSED"
        --configured-registry "$REGISTRY"
        --store-bytes "$STORE_BYTES"
      )
      if [ -n "$PROGRESS_LINE" ]; then
        REPORT_ARGS+=(--pnpm-progress "$PROGRESS_LINE")
      fi
      # shellcheck disable=SC2086
      python3 /tmp/ajrly-dependency-cache.py "${REPORT_ARGS[@]}" $LOCAL_WARM_FLAG \
        | tee "$CI_PROJECT_DIR/.ci-tmp/dependency-phase-${PHASE}.json"
      # Bounded single-job API typecheck (not whole-monorepo claim).
      pnpm --filter api typecheck \
        2>&1 | tee "$CI_PROJECT_DIR/.ci-tmp/api-typecheck-${PHASE}.log"
      echo "node-scoped-install-canary phase=$PHASE job_scope=$JOB_SCOPE archive_scope=$ARCHIVE_SCOPE restore=$RESTORE_STATUS install_elapsed_s=$ELAPSED progress=${PROGRESS_LINE:-none}"
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - .ci-tmp/dependency-restore.json
      - .ci-tmp/dependency-phase-*.json
      - .ci-tmp/pnpm-install-*.log
      - .ci-tmp/api-typecheck-*.log
