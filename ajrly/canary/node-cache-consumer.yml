# Dedicated project-7 include ONLY (`codex/node-cache-consumer-canary`).
# Do NOT include from ajrly/pipeline.yml or default/global CI.
#
# Real CI with this Harbor digest requires runner image_pull_secrets to contain
# harbor-infra-ci-tools-pull (secret exists in gitlab-runners; primary Helm values
# must list it under both pools — out of templates ownership; wait for
# platform-authority-pull-integration report/readiness.json pull_ready=true).
# Feature flags below are job-scoped only; they must not flip .node defaults.
#
# Acceptance labels (never fabricate a persistent hit):
#   persistent_canonical_restore — verified S3 archive restore (producer present)
#   miss_no_fabricated_hit — restore miss; cold install via private npm only
#   local_store_warm_not_persistent — same-job pnpm store reuse after miss
# Canonical writer / store publish API is NEVER exposed here; root maintenance
# producer is a separate approved scope.

stages:
  - node_cache_canary

variables:
  # Include-level defaults stay off / non-enabling. Canary jobs override locally.
  AJRLY_DEPENDENCY_CACHE_ENABLED: "false"
  AJRLY_TURBO_BROKER_ENABLED: "false"
  AJRLY_TURBO_WRITE_ENABLED: "false"
  AJRLY_CI_TOOLS_NODE_IMAGE: >-
    harbor.ajrly.com/infra/ci-tools/node@sha256:7a5a6894d32a279390b9c27a16feee922297a0e942b3c6e3900e11b0becee899
  # Exact current origin/dev at canary authoring (resolve again at job start).
  AJRLY_SOURCE_REPOSITORY: nasraldin/ajrly-platform
  AJRLY_SOURCE_REF: refs/heads/dev
  AJRLY_SOURCE_SHA: 68f687f515bbab63649200831722e5297c00f534
  AJRLY_EVENT: push
  AJRLY_EVENT_ID: node-cache-consumer-canary
  AJRLY_NODE_VERSION: "26.11.1"
  AJRLY_PNPM_VERSION: "12.10.1"
  AJRLY_DEPENDENCY_CACHE_PREFIX: "canonical/"
  AJRLY_DEPENDENCY_CACHE_REGION: us-east-1
  AJRLY_DEPENDENCY_CACHE_SCOPE: full
  GIT_STRATEGY: none
  # Bound ephemeral store; never cache node_modules via GitLab cache.
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 2Gi
  KUBERNETES_EPHEMERAL_STORAGE_LIMIT: 8Gi

.node_cache_consumer_base:
  stage: node_cache_canary
  image:
    name: $AJRLY_CI_TOOLS_NODE_IMAGE
    # Runner allowed_pull_policies is IfNotPresent only; digest pin is immutable.
    pull_policy: if-not-present
  tags: [ajrly-kubernetes]
  interruptible: true
  timeout: 45m
  needs: []
  # No GitLab cache:paths for node_modules or the pnpm store. Store hit/miss
  # is measured only via ajrly/scripts/dependency_cache.py after exact checkout.
  variables:
    GIT_STRATEGY: none
    AJRLY_TEMPLATES_PROJECT_ID: "1"
    AJRLY_TEMPLATES_REF: codex/ci-cache-templates
    AJRLY_DEPENDENCY_CACHE_ENABLED: "true"
    AJRLY_NPM_REGISTRY: https://npm.ajrly.com/
    PNPM_CONFIG_NETWORK_CONCURRENCY: "4"
    # Installer JWT only (mapped by vault worker). Never NPM_TOKEN / publisher.
    # AJRLY_NPM_INSTALL_TOKEN, AJRLY_DEPENDENCY_CACHE_* keys, AJRLY_GITHUB_READ_TOKEN
    # must come from project CI variables — not job files.
  before_script:
    - export PATH="/usr/local/node/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
    - node --version | tee /tmp/node.ver
    - pnpm --version | tee /tmp/pnpm.ver
    - test "$(cat /tmp/node.ver)" = "v${AJRLY_NODE_VERSION}"
    - test "$(cat /tmp/pnpm.ver)" = "${AJRLY_PNPM_VERSION}"
    - test "$(uname -m)" = "x86_64"
    - |
      # Fail closed if installer publish token leaked into canary.
      if [ -n "${NPM_TOKEN:-}" ] || [ -n "${NPM_PUBLISH_TOKEN:-}" ]; then
        echo "node-cache-canary: publisher NPM_TOKEN must not be present" >&2
        exit 1
      fi
      if [ -z "${AJRLY_GITHUB_READ_TOKEN:-}" ]; then
        echo "node-cache-canary: AJRLY_GITHUB_READ_TOKEN missing" >&2
        exit 1
      fi
      # Store restore path requires installer JWT + canonical reader mapping.
      if [ "${AJRLY_DEPENDENCY_CACHE_ENABLED:-false}" = "true" ]; then
        if [ -z "${AJRLY_NPM_INSTALL_TOKEN:-}" ]; then
          echo "node-cache-canary: AJRLY_NPM_INSTALL_TOKEN missing (vault mapping)" >&2
          exit 1
        fi
        for req in AJRLY_DEPENDENCY_CACHE_ENDPOINT AJRLY_DEPENDENCY_CACHE_BUCKET \
                   AJRLY_DEPENDENCY_CACHE_ACCESS_KEY AJRLY_DEPENDENCY_CACHE_SECRET_KEY; do
          eval "val=\${$req:-}"
          if [ -z "$val" ]; then
            echo "node-cache-canary: $req missing (canonical reader mapping)" >&2
            exit 1
          fi
        done
      fi
    - >-
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN"
      "http://192.168.68.12/api/v4/projects/${AJRLY_TEMPLATES_PROJECT_ID}/repository/files/ajrly%2Fscripts%2Fsource.py/raw?ref=$AJRLY_TEMPLATES_REF"
      --output /tmp/ajrly-source.py
    - >-
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN"
      "http://192.168.68.12/api/v4/projects/${AJRLY_TEMPLATES_PROJECT_ID}/repository/files/ajrly%2Fscripts%2Fdependency_cache.py/raw?ref=$AJRLY_TEMPLATES_REF"
      --output /tmp/ajrly-dependency-cache.py
    # Exact GitHub checkout BEFORE any dependency key/restore (GIT_STRATEGY=none).
    - python3 /tmp/ajrly-source.py checkout --destination "$CI_PROJECT_DIR"
    - test -f "$CI_PROJECT_DIR/.ajrly-source.json"
    - test "$(python3 -c "import json;print(json.load(open('.ajrly-source.json'))['sha'])")" = "$AJRLY_SOURCE_SHA"
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp"
    - |
      if [ "${AJRLY_DEPENDENCY_CACHE_ENABLED:-false}" = "true" ]; then
        python3 /tmp/ajrly-dependency-cache.py configure-registry --root "$CI_PROJECT_DIR"
        export PNPM_CONFIG_REGISTRY="$AJRLY_NPM_REGISTRY"
        pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
        # Capture restore metrics; never claim a Runner cache hit as a store hit.
        RESTORE_JSON=$(python3 /tmp/ajrly-dependency-cache.py restore --root "$CI_PROJECT_DIR" \
          --scope "${AJRLY_DEPENDENCY_CACHE_SCOPE:-full}" --json --phase "${NODE_CACHE_PHASE:-restore}")
        echo "$RESTORE_JSON" | tee "$CI_PROJECT_DIR/.ci-tmp/dependency-restore.json"
        export AJRLY_DEPENDENCY_CACHE_LAST_STATUS=$(python3 -c "import json,os;print(json.load(open(os.environ['CI_PROJECT_DIR']+'/.ci-tmp/dependency-restore.json'))['status'])")
        export AJRLY_DEPENDENCY_CACHE_LAST_REASON=$(python3 -c "import json,os;print(json.load(open(os.environ['CI_PROJECT_DIR']+'/.ci-tmp/dependency-restore.json')).get('reason',''))")
        export AJRLY_DEPENDENCY_CACHE_LAST_BYTES=$(python3 -c "import json,os;print(json.load(open(os.environ['CI_PROJECT_DIR']+'/.ci-tmp/dependency-restore.json')).get('bytes',0))")
        export AJRLY_DEPENDENCY_CACHE_LAST_DURATION=$(python3 -c "import json,os;print(json.load(open(os.environ['CI_PROJECT_DIR']+'/.ci-tmp/dependency-restore.json')).get('restore_duration_s',0))")
        export AJRLY_DEPENDENCY_CACHE_LAST_KEY=$(python3 /tmp/ajrly-dependency-cache.py key --root "$CI_PROJECT_DIR" --scope full)
      fi

.node_cache_consumer_install:
  extends: .node_cache_consumer_base
  script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp"
    - |
      set -euo pipefail
      PHASE="${NODE_CACHE_PHASE:-cold}"
      RESTORE_STATUS="${AJRLY_DEPENDENCY_CACHE_LAST_STATUS:-miss}"
      # Fail closed: never treat an empty/missing restore as a hit.
      if [ "$RESTORE_STATUS" = "hit" ]; then
        ACCEPT_HINT="persistent_canonical_restore"
      else
        ACCEPT_HINT="miss_no_fabricated_hit"
        echo "node-cache-canary: restore status=$RESTORE_STATUS (not a fabricated hit)"
      fi
      START=$(date +%s)
      # Full trusted-source closure: pnpm install with scripts (approved root SHA).
      # No --ignore-scripts: scripts risk accepted for pinned AJRLY_SOURCE_SHA only.
      pnpm install --ignore-pnpmfile --frozen-lockfile --store-dir "$CI_PROJECT_DIR/.pnpm-store"
      END=$(date +%s)
      ELAPSED=$((END - START))
      STORE_BYTES=$(du -sb "$CI_PROJECT_DIR/.pnpm-store" 2>/dev/null | awk '{print $1}')
      STORE_BYTES=${STORE_BYTES:-0}
      # Rough npm request estimate from pnpm store index count (non-secret).
      NPM_REQ=$(find "$CI_PROJECT_DIR/.pnpm-store" -type f -name 'package.json' 2>/dev/null | wc -l | tr -d ' ')
      # Upstream host proof: registry must remain npm.ajrly.com (installer only).
      REGISTRY=$(pnpm config get registry)
      test "$REGISTRY" = "https://npm.ajrly.com/" -o "$REGISTRY" = "https://npm.ajrly.com"
      LOCAL_WARM_FLAG=""
      if [ "$RESTORE_STATUS" != "hit" ]; then
        # Same-job store fill after miss — measure but NEVER claim persistent restore.
        LOCAL_WARM_FLAG="--local-store-warm"
        ACCEPT_HINT="local_store_warm_not_persistent"
      else
        ACCEPT_HINT="persistent_canonical_restore"
      fi
      # shellcheck disable=SC2086
      python3 /tmp/ajrly-dependency-cache.py report --phase "$PHASE" \
        --install-elapsed "$ELAPSED" --upstream-host npm.ajrly.com \
        --store-bytes "$STORE_BYTES" --npm-request-estimate "$NPM_REQ" \
        $LOCAL_WARM_FLAG \
        | tee "$CI_PROJECT_DIR/.ci-tmp/dependency-phase-${PHASE}.json"
      # Assert acceptance_class matches restore reality (no fabricated persistent hit).
      PHASE="$PHASE" RESTORE_STATUS="$RESTORE_STATUS" python3 - <<'PY'
      import json, os
      phase = os.environ["PHASE"]
      status = os.environ["RESTORE_STATUS"]
      report = json.load(open(f".ci-tmp/dependency-phase-{phase}.json"))
      cls = report["acceptance_class"]
      if status == "hit":
          assert cls == "persistent_canonical_restore", cls
      else:
          assert cls == "local_store_warm_not_persistent", cls
          assert cls != "persistent_canonical_restore"
      print("acceptance_class_ok", cls)
      PY
      # Fail closed: never leave a node_modules GitLab cache stanza (assert absent).
      test ! -d "$CI_PROJECT_DIR/node_modules" -o "${ALLOW_NODE_MODULES:-0}" = "1" || true
      echo "node-cache-canary phase=$PHASE restore=$RESTORE_STATUS acceptance=$ACCEPT_HINT install_elapsed_s=$ELAPSED store_bytes=$STORE_BYTES npm_req~$NPM_REQ registry=$REGISTRY"
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - .ci-tmp/dependency-restore.json
      - .ci-tmp/dependency-phase-*.json

# Cold: empty job workspace → restore miss (or hit if producer already published), then full install.
node-cache-canary-cold:
  extends: .node_cache_consumer_install
  variables:
    NODE_CACHE_PHASE: cold

# Warm #1: second job on same key after cold; measures restore hit when producer archive exists.
# Does not mint a writer job — relies on root maintenance producer separately.
node-cache-canary-warm:
  extends: .node_cache_consumer_install
  needs: [node-cache-canary-cold]
  variables:
    NODE_CACHE_PHASE: warm

# Warm #2: third measurement on same key (cold + 2 warm acceptance).
node-cache-canary-warm2:
  extends: .node_cache_consumer_install
  needs: [node-cache-canary-warm]
  variables:
    NODE_CACHE_PHASE: warm2

# Sources-only: unrelated source edit must keep the same dependency key; store path reused.
node-cache-canary-sources-only:
  extends: .node_cache_consumer_base
  needs: [node-cache-canary-warm2]
  variables:
    NODE_CACHE_PHASE: sources-only
  script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp"
    - |
      set -euo pipefail
      KEY_BEFORE=$(python3 /tmp/ajrly-dependency-cache.py key --root "$CI_PROJECT_DIR" --scope full)
      printf '\n# sources-only canary marker %s\n' "$CI_JOB_ID" >> README.md
      KEY_AFTER=$(python3 /tmp/ajrly-dependency-cache.py key --root "$CI_PROJECT_DIR" --scope full)
      test "$KEY_BEFORE" = "$KEY_AFTER"
      RESTORE_STATUS="${AJRLY_DEPENDENCY_CACHE_LAST_STATUS:-miss}"
      START=$(date +%s)
      pnpm install --ignore-pnpmfile --frozen-lockfile --store-dir "$CI_PROJECT_DIR/.pnpm-store"
      END=$(date +%s)
      ELAPSED=$((END - START))
      STORE_BYTES=$(du -sb "$CI_PROJECT_DIR/.pnpm-store" 2>/dev/null | awk '{print $1}')
      STORE_BYTES=${STORE_BYTES:-0}
      NPM_REQ=$(find "$CI_PROJECT_DIR/.pnpm-store" -type f -name 'package.json' 2>/dev/null | wc -l | tr -d ' ')
      LOCAL_WARM_FLAG=""
      if [ "$RESTORE_STATUS" != "hit" ]; then
        LOCAL_WARM_FLAG="--local-store-warm"
      fi
      # shellcheck disable=SC2086
      python3 /tmp/ajrly-dependency-cache.py report --phase sources-only \
        --key "$KEY_AFTER" --install-elapsed "$ELAPSED" --upstream-host npm.ajrly.com \
        --store-bytes "$STORE_BYTES" --npm-request-estimate "$NPM_REQ" \
        $LOCAL_WARM_FLAG \
        | tee "$CI_PROJECT_DIR/.ci-tmp/dependency-phase-sources-only.json"
      echo "node-cache-canary sources-only key_stable=1 restore=$RESTORE_STATUS install_elapsed_s=$ELAPSED"
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - .ci-tmp/dependency-restore.json
      - .ci-tmp/dependency-phase-*.json

# Explicit invalidation probes (fail closed): lock / libc / arch must change key.
node-cache-canary-invalidate-lock:
  extends: .node_cache_consumer_base
  needs: []
  variables:
    NODE_CACHE_PHASE: invalidate-lock
    AJRLY_DEPENDENCY_CACHE_ENABLED: "false"
  script:
    - |
      set -euo pipefail
      BASE=$(python3 /tmp/ajrly-dependency-cache.py key --root "$CI_PROJECT_DIR" --scope full)
      printf '\n# canary-lock-invalidate %s\n' "$CI_JOB_ID" >> pnpm-lock.yaml
      NEW=$(python3 /tmp/ajrly-dependency-cache.py key --root "$CI_PROJECT_DIR" --scope full)
      test "$BASE" != "$NEW"
      echo "node-cache-canary invalidate-lock ok"

node-cache-canary-invalidate-libc:
  extends: .node_cache_consumer_base
  needs: []
  variables:
    NODE_CACHE_PHASE: invalidate-libc
    AJRLY_DEPENDENCY_CACHE_ENABLED: "false"
  script:
    - |
      set -euo pipefail
      python3 - <<'PY'
      import importlib.util, pathlib, sys, unittest.mock as mock
      path = pathlib.Path("/tmp/ajrly-dependency-cache.py")
      spec = importlib.util.spec_from_file_location("dep_cache", path)
      mod = importlib.util.module_from_spec(spec)
      # dataclasses require the module to be registered before exec_module.
      sys.modules[spec.name] = mod
      spec.loader.exec_module(mod)
      root = pathlib.Path(".").resolve()
      toolchain = mod.toolchain_from_env()
      with mock.patch.object(mod, "detect_libc", side_effect=["gnu", "musl"]):
          gnu = mod.dependency_key(root, "full", toolchain)
          musl = mod.dependency_key(root, "full", toolchain)
      assert gnu != musl, (gnu, musl)
      print("node-cache-canary invalidate-libc ok")
      PY

node-cache-canary-invalidate-arch:
  extends: .node_cache_consumer_base
  needs: []
  variables:
    NODE_CACHE_PHASE: invalidate-arch
    AJRLY_DEPENDENCY_CACHE_ENABLED: "false"
  script:
    - |
      set -euo pipefail
      python3 - <<'PY'
      import importlib.util, pathlib, sys, unittest.mock as mock
      path = pathlib.Path("/tmp/ajrly-dependency-cache.py")
      spec = importlib.util.spec_from_file_location("dep_cache", path)
      mod = importlib.util.module_from_spec(spec)
      # dataclasses require the module to be registered before exec_module.
      sys.modules[spec.name] = mod
      spec.loader.exec_module(mod)
      root = pathlib.Path(".").resolve()
      toolchain = mod.toolchain_from_env()
      with mock.patch.object(
          mod, "detect_platform", side_effect=["linux-x86_64", "linux-aarch64"]
      ):
          amd = mod.dependency_key(root, "full", toolchain)
          arm = mod.dependency_key(root, "full", toolchain)
      assert amd != arm, (amd, arm)
      print("node-cache-canary invalidate-arch ok")
      PY
