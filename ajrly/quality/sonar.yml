sonar:admin:
  extends: .node
  stage: analysis
  rules:
    - if: $RUN_SONAR == "true" && $AJRLY_PIPELINE_MODE == "trusted"
    - when: never
  variables:
    PROJECT_PATH: apps/web/admin
    SONAR_PROJECT_PATH: apps/web/admin
    SONAR_PROJECT_KEY: ajrly-platform-admin
    SONAR_PROJECT_NAME: Ajrly Platform - App - admin
    SONAR_COVERAGE_PATH: coverage/lcov.info
    SONAR_HOST_URL: https://sonar.ajrly.com
  script:
    - node scripts/pnpm-install-scoped.mjs
    - pnpm turbo run build --filter="./apps/web/admin..." --concurrency=1
    - pnpm --filter "./apps/web/admin" test:coverage
    - test -f "apps/web/admin/coverage/lcov.info"
    - export SONAR_TOKEN="${PLATFORM_SONAR_ADMIN_TOKEN}"; test -n "$SONAR_TOKEN"; bash scripts/ci/sonar-scan.sh
