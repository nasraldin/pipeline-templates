image-build:
  extends: .node
  stage: publish
  interruptible: false
  rules:
    - if: $RUN_IMAGE_BUILD == "true" && $AJRLY_PIPELINE_MODE == "trusted" && $AJRLY_BUILDKIT_READY == "true" && $APP_PATH && $APP_NAME
      when: manual
    - when: never
  variables:
    BUILD_CONTEXT: .
    DOCKERFILE_PATH: Dockerfile
    IMAGE_TAGS: latest
    BUILDKIT_HOST: tcp://127.0.0.1:1234
    # Match authority-issued builder_id / template_ref claims (server-derived job-*).
    AJRLY_BUILDER_ID: "job-$CI_JOB_ID"
    AJRLY_TEMPLATE_REF: "$AJRLY_TEMPLATES_REF"
  script:
    - test -n "$PLATFORM_HARBOR_PASSWORD"
    - bash scripts/ci/build-image.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .ci-tmp/*/image-proof.json
      - .ci-tmp/*/build-metadata.json
  services:
    # Verified digest from source build_image_policy (skopeo 2026-10-14). Not invented.
    - name: moby/buildkit:v0.33.1-rootless@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
      alias: buildkit
      command:
        - --addr
        - tcp://0.0.0.0:1234
        - --oci-worker-no-process-sandbox
