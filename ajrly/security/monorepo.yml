security:semgrep:
  extends: [.node, .ajrly_check_resources]
  stage: analysis
  rules: &id001
    - if: $RUN_SECURITY == "true"
      when: on_success
    - when: never
  script:
    - bash scripts/ci/security-tools.sh semgrep
security:osv:
  extends: [.node, .ajrly_check_resources]
  stage: analysis
  rules: *id001
  script:
    - bash scripts/ci/security-tools.sh osv
security:audit:
  extends: .node
  stage: analysis
  rules: *id001
  script:
    - pnpm install --frozen-lockfile
    - pnpm audit --audit-level=high
security:gitleaks:
  stage: analysis
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint:
      - ""
  cache: []
  rules: &id002
    - if: $RUN_SECURITY == "true"
      when: on_success
    - when: never
  script:
    - gitleaks dir . --config .gitleaks.toml --redact --exit-code 1
  extends:
    - .ajrly_source
    - .ajrly_check_resources
  needs: []
  before_script:
    - apk add --no-cache git python3 curl ca-certificates
    - !reference [.ajrly_source, before_script]
security:trivy:
  stage: analysis
  image:
    name: aquasec/trivy:0.75.0
    entrypoint:
      - ""
  # Never reuse GitLab job/task artifacts for the vulnerability DB.
  cache: []
  rules: *id002
  variables:
    AJRLY_TRIVY_FEED_ENABLED: "false"
    AJRLY_TRIVY_FEED_MAX_AGE_SECONDS: "86400"
  script:
    - |
      set -euo pipefail
      # Persistent readonly feed (optional): provenance + 24h freshness, no skip.
      eval "$(python3 /tmp/ajrly-security-feed.py prepare)"
      test "${AJRLY_TRIVY_TASK_ARTIFACT_REUSE:-}" = "false"
      trivy fs --timeout 15m --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
        --skip-dirs .git,node_modules,.next,dist,coverage,test-results .
      trivy config --severity HIGH,CRITICAL --exit-code 1 apps/backend/api/Dockerfile
      trivy config --severity HIGH,CRITICAL --exit-code 1 apps/web/admin/Dockerfile
  extends:
    - .ajrly_source
    - .ajrly_check_resources
  needs: []
  before_script:
    - apk add --no-cache git python3 curl ca-certificates
    - !reference [.ajrly_source, before_script]
    - >-
      test -n "$AJRLY_TEMPLATES_REF" &&
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN"
      "http://192.168.68.12/api/v4/projects/1/repository/files/ajrly%2Fscripts%2Fsecurity_feed.py/raw?ref=$AJRLY_TEMPLATES_REF"
      --output /tmp/ajrly-security-feed.py
