security:semgrep:
  extends: [.node, .ajrly_check_resources]
  stage: analysis
  rules: &id001
    - if: $RUN_SECURITY == "true"
      when: on_success
    - when: never
  script:
    - bash scripts/ci/security-tools.sh semgrep
security:osv:
  extends: [.node, .ajrly_check_resources]
  stage: analysis
  rules: *id001
  script:
    - bash scripts/ci/security-tools.sh osv
security:audit:
  extends: .node
  stage: analysis
  rules: *id001
  script:
    - pnpm install --frozen-lockfile
    - pnpm audit --audit-level=high
security:gitleaks:
  stage: analysis
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint:
      - ""
  cache: []
  rules: &id002
    - if: $RUN_SECURITY == "true"
      when: on_success
    - when: never
  script:
    - gitleaks dir . --config .gitleaks.toml --redact --exit-code 1
  extends:
    - .ajrly_source
    - .ajrly_check_resources
  needs: []
  before_script:
    - apk add --no-cache git python3 curl ca-certificates
    - !reference [.ajrly_source, before_script]
security:trivy:
  stage: analysis
  image:
    name: aquasec/trivy:0.75.0
    entrypoint:
      - ""
  cache: []
  rules: *id002
  script:
    - trivy fs --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs node_modules,.next,dist,coverage,test-results
      .
    - trivy config --severity HIGH,CRITICAL --exit-code 1 apps/backend/api/Dockerfile
    - trivy config --severity HIGH,CRITICAL --exit-code 1 apps/web/admin/Dockerfile
  extends:
    - .ajrly_source
    - .ajrly_check_resources
  needs: []
  before_script:
    - apk add --no-cache git python3 curl ca-certificates
    - !reference [.ajrly_source, before_script]
