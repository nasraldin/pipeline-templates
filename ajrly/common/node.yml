.node:
  variables:
    # Cache/npm/turbo feature flags live in pipeline.yml / canary top-level
    # variables so dedicated project-7 coordinators can enable contracts without
    # replacing this hidden job. Job-hardcoded false would beat YAML globals.
    PNPM_CONFIG_NETWORK_CONCURRENCY: "4"
    AJRLY_NODE_VERSION: "26.11.1"
    AJRLY_PNPM_VERSION: "12.10.1"
    # The TS 7 CLI uses Go; leave room for Node and Turbopack in the same pod.
    GOMAXPROCS: "2"
    GOMEMLIMIT: 1GiB
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl python3 gnupg unzip
      ca-certificates
    - !reference [.ajrly_source, before_script]
    - >-
      test -n "$AJRLY_TEMPLATES_REF" &&
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN"
      "http://192.168.68.12/api/v4/projects/1/repository/files/ajrly%2Fscripts%2Fdependency_cache.py/raw?ref=$AJRLY_TEMPLATES_REF"
      --output /tmp/ajrly-dependency-cache.py
    - |
      if [ -n "${AJRLY_NPM_REGISTRY:-}" ]; then
        python3 /tmp/ajrly-dependency-cache.py configure-registry --root "$CI_PROJECT_DIR"
        # The helper subprocess cannot export into this shell. Environment
        # configuration takes precedence over the generated project .npmrc.
        export PNPM_CONFIG_REGISTRY="$AJRLY_NPM_REGISTRY"
      elif [ -n "${AJRLY_NPM_INSTALL_TOKEN:-}" ]; then
        echo "dependency-cache: AJRLY_NPM_INSTALL_TOKEN set without AJRLY_NPM_REGISTRY" >&2
        exit 1
      elif [ -n "${NPM_TOKEN:-}" ]; then
        bash scripts/ci/npm-registry-auth.sh
      fi
    - curl --fail --silent --show-error --location https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.10.1.tgz
      | tar -xz --strip-components=1 -C /usr/local/bin package/pnpm
    - pnpm --version && node --version
    - export CI_JOB_TMPDIR="$CI_PROJECT_DIR/.ci-tmp/$CI_JOB_ID"; mkdir -p "$CI_JOB_TMPDIR"
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - |
      # Exact-source verification completed above (GIT_STRATEGY=none). Key/restore only
      # after checkout. No GitLab archive key-files. Ordinary jobs never upload canonical archives.
      # Scope is job-definition authoritative (PROJECT_PATH/PNPM_INSTALL_SCOPE via --scope-from-job),
      # not a caller-writable AJRLY_DEPENDENCY_CACHE_SCOPE widen to full.
      # Hit → prefer-offline (use restored store). Valid miss → cold online install.
      # Rejected/unsafe archive → restore exits non-zero (fail closed).
      mkdir -p "$CI_PROJECT_DIR/.ci-tmp"
      RESTORE_JSON=$(python3 /tmp/ajrly-dependency-cache.py restore --root "$CI_PROJECT_DIR" \
        --scope-from-job --json --phase restore \
        --configured-registry "${AJRLY_NPM_REGISTRY:-${PNPM_CONFIG_REGISTRY:-}}")
      echo "$RESTORE_JSON" | tee "$CI_PROJECT_DIR/.ci-tmp/dependency-restore.json"
      export AJRLY_DEPENDENCY_CACHE_LAST_STATUS=$(python3 -c "import json,os;print(json.load(open(os.environ['CI_PROJECT_DIR']+'/.ci-tmp/dependency-restore.json'))['status'])")
      export AJRLY_DEPENDENCY_CACHE_LAST_REASON=$(python3 -c "import json,os;print(json.load(open(os.environ['CI_PROJECT_DIR']+'/.ci-tmp/dependency-restore.json')).get('reason',''))")
      if [ "$AJRLY_DEPENDENCY_CACHE_LAST_STATUS" = "hit" ]; then
        # Store hit → prefer-offline (tarballs from restored store). Do NOT set
        # PNPM_CONFIG_OFFLINE: the 60b2 archive does not include pnpm metadata-full,
        # so hard offline fails with ERR_PNPM_NO_OFFLINE_META (pipeline 501).
        # Missing meta resolves via private AJRLY_NPM_REGISTRY (internal LAN route).
        # Miss stays online for authentic cold install. Never write offline via
        # `pnpm config set` (pnpm 12 rejects that key in global config.yaml).
        export PNPM_CONFIG_PREFER_OFFLINE=true
        unset PNPM_CONFIG_OFFLINE || true
        pnpm config set prefer-offline true
      else
        unset PNPM_CONFIG_PREFER_OFFLINE PNPM_CONFIG_OFFLINE || true
        pnpm config set prefer-offline false
      fi
    - >-
      test -n "$AJRLY_TEMPLATES_REF" &&
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN"
      "http://192.168.68.12/api/v4/projects/1/repository/files/ajrly%2Fscripts%2Fturbo_cache_broker.py/raw?ref=$AJRLY_TEMPLATES_REF"
      --output /tmp/ajrly-turbo-cache-broker.py
    - |
      # Turbo remote cache only via authority proxy after exact checkout. Default off.
      # Never export upstream writer credentials into the job.
      export TURBO_CACHE=local:rw
      unset TURBO_TOKEN TURBO_CACHE_READ_TOKEN TURBO_CACHE_TOKEN || true
      if [ "${AJRLY_TURBO_BROKER_ENABLED:-false}" = "true" ]; then
        eval "$(python3 /tmp/ajrly-turbo-cache-broker.py configure)"
      elif [ -n "${TURBO_API:-}" ] && [ -n "${TURBO_CACHE_READ_TOKEN:-}" ]; then
        # Legacy gated path retained until broker canary; still no writer token.
        export TURBO_TOKEN="$TURBO_CACHE_READ_TOKEN" TURBO_CACHE=local:rw,remote:r
      fi
  extends:
    - .ajrly_source
    - .ajrly_build_resources
  needs: []
