.ajrly_check_resources:
  tags: [ajrly-kubernetes-checks]
  variables:
    KUBERNETES_CPU_REQUEST: 100m
    KUBERNETES_CPU_LIMIT: "1"
    KUBERNETES_MEMORY_REQUEST: 256Mi
    KUBERNETES_MEMORY_LIMIT: 1Gi
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 1Gi
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: 8Gi
.ajrly_build_resources:
  variables:
    KUBERNETES_CPU_REQUEST: 500m
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: 2Gi
    KUBERNETES_MEMORY_LIMIT: 4Gi
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 1Gi
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: 8Gi
.ajrly_integration_resources:
  variables:
    KUBERNETES_CPU_REQUEST: 500m
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: 1Gi
    KUBERNETES_MEMORY_LIMIT: 2Gi
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 1Gi
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: 8Gi
