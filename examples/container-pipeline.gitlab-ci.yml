# Example: container app pipeline with Trivy + GitLab container scanning
#
# Copy relevant sections into your app repo .gitlab-ci.yml.
# Requires GitLab Container Registry (CI_REGISTRY_IMAGE) and a Dockerfile.

include:
  - project: homelab/pipeline-templates
    ref: main
    file:
      - templates/lint/yaml.yml
      - templates/container/build.yml
      - templates/container/trivy-image-scan.yml
      - templates/container/container-scan.yml
      - templates/container/harbor-push.yml

stages:
  - lint
  - build
  - scan
  - publish

variables:
  TRIVY_SEVERITY: "CRITICAL,HIGH"
  HARBOR_PROJECT: "apps"

# Harbor-only apps: swap build.yml for harbor-build-push.yml and override
# container:trivy-image-scan needs to container:harbor-build-push.
